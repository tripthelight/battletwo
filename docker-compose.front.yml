x-front-common: &front-common
  image: battletwo-front:local
  build:
    context: .
    dockerfile: Dockerfile
    args:
      SOCKET_HOST: ${SOCKET_HOST:-ws://127.0.0.1}
      SOCKET_PORT: ${SOCKET_PORT:-4000}
      RTC_PORT: ${RTC_PORT:-5000}
      CLIENT_HOST: ${CLIENT_HOST:-http://127.0.0.1}
      CLIENT_PORT: ${CLIENT_PORT:-8082}
      JWT_HOST: ${JWT_HOST:-http://127.0.0.1}
      JWT_PORT: ${JWT_PORT:-6000}
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
    interval: 10s
    timeout: 3s
    start_period: 5s
    retries: 3

services:
  front-1:
    <<: *front-common
    container_name: battletwo-front-1
    networks:
      battletwo-front-net:
        aliases:
          - front-1

  front-2:
    <<: *front-common
    container_name: battletwo-front-2
    networks:
      battletwo-front-net:
        aliases:
          - front-2

  front-lb:
    image: nginx:alpine
    container_name: battletwo-front-lb
    restart: unless-stopped

    depends_on:
      front-1:
        condition: service_healthy
      front-2:
        condition: service_healthy

    ports:
      - "8082:80"

    volumes:
      - ./nginx/lb.conf:/etc/nginx/conf.d/default.conf:ro

    networks:
      - battletwo-front-net

    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3

networks:
  battletwo-front-net:
    name: battletwo-front-net
    driver: bridge
