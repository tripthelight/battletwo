x-front-build: &front-build
  context: .
  dockerfile: Dockerfile
  args:
    SOCKET_HOST: ${SOCKET_HOST:-ws://127.0.0.1}
    SOCKET_PORT: ${SOCKET_PORT:-4000}
    RTC_PORT: ${RTC_PORT:-8083}
    CLIENT_HOST: ${CLIENT_HOST:-http://127.0.0.1}
    CLIENT_PORT: ${CLIENT_PORT:-8082}
    JWT_HOST: ${JWT_HOST:-http://127.0.0.1}
    JWT_PORT: ${JWT_PORT:-6000}

x-front-common: &front-common
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
    interval: 10s
    timeout: 3s
    start_period: 5s
    retries: 3

services:
  front-blue-1:
    <<: *front-common
    image: battletwo-front:blue
    build: *front-build
    container_name: battletwo-front-blue-1
    networks:
      battletwo-front-net:
        aliases:
          - front-blue-1

  front-blue-2:
    <<: *front-common
    image: battletwo-front:blue
    container_name: battletwo-front-blue-2
    networks:
      battletwo-front-net:
        aliases:
          - front-blue-2

  front-green-1:
    <<: *front-common
    image: battletwo-front:green
    build: *front-build
    container_name: battletwo-front-green-1
    networks:
      battletwo-front-net:
        aliases:
          - front-green-1

  front-green-2:
    <<: *front-common
    image: battletwo-front:green
    container_name: battletwo-front-green-2
    networks:
      battletwo-front-net:
        aliases:
          - front-green-2

  front-lb:
    image: nginx:alpine
    container_name: battletwo-front-lb
    restart: unless-stopped

    ports:
      - "8082:80"

    volumes:
      - ./nginx/lb-blue.conf:/etc/nginx/battletwo-slots/lb-blue.conf:ro
      - ./nginx/lb-green.conf:/etc/nginx/battletwo-slots/lb-green.conf:ro
      - ./nginx/lb-entrypoint.sh:/etc/nginx/battletwo/lb-entrypoint.sh:ro
      - battletwo-lb-state:/etc/nginx/battletwo-active

    entrypoint:
      - /bin/sh
      - /etc/nginx/battletwo/lb-entrypoint.sh

    networks:
      - battletwo-front-net

    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3

networks:
  battletwo-front-net:
    name: battletwo-front-net
    driver: bridge

volumes:
  battletwo-lb-state:
    name: battletwo-lb-state
