<svg
  xmlns="http://www.w3.org/2000/svg"
  xmlns:xlink="http://www.w3.org/1999/xlink"
  width="300"
  height="300"
  viewBox="0 0 300 300"
  id="LOGO_BATTLETWO"
><!-- 22 40 => 31 -->
  <defs>
    <style>
      :root {
        --logo-fill: #000;
        --logo-bg: #FFF;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --logo-fill: #FFF;
          --logo-bg: #000;
        }
      }

      #LOGO_BATTLETWO defs linearGradient stop {
        stop-color: var(--logo-fill);
      }

      #LOGO_BATTLETWO .logo-bg {
        fill: var(--logo-bg);
      }

      #LOGO_BATTLETWO .logo-fill {
        fill: var(--logo-fill);
      }
    </style>

    <linearGradient
      id="gradient-start"
      gradientTransform="rotate(90)"
    >
      <stop offset="0%"></stop>
      <stop offset="50%"></stop>
      <stop
        offset="100%"
        stop-opacity="0"
      ></stop>
    </linearGradient>

    <linearGradient
      id="gradient-end"
      gradientTransform="rotate(90)"
    >
      <stop
        offset="0%"
        stop-opacity="0"
      ></stop>
      <stop
        offset="30%"
        stop-opacity="0.3"
      ></stop>
      <stop
        offset="60%"
        stop-opacity="1"
      ></stop>
      <stop
        offset="100%"
        stop-opacity="1"
      ></stop>
    </linearGradient>
  </defs>

  <!-- LOGO BG -->
  <path
    class="logo-bg"
    d="
      M0,80
      A80,80 0 0,1 80,0
      L220,0
      A80,80 0 0,1 300,80
      L300,220
      A80,80 0 0,1 220,300
      L80,300
      A80,80 0 0,1 0,220
      L0,80
      Z
    "
  /><!-- // LOGO BG -->

